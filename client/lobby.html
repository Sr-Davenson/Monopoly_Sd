<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monopoly SD — Lobby de Jugadores</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
  <style>
    /* Indicador de estado de la conexión WebSocket */
    .conn-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text-muted);
    }
    .conn-status .status-dot { transition: background-color 0.3s, box-shadow 0.3s; }

    .conn-status[data-state="connecting"] { color: #fcd34d; border-color: rgba(245, 158, 11, 0.4); }
    .conn-status[data-state="connecting"] .status-dot {
      background-color: var(--warning);
      box-shadow: 0 0 8px var(--warning);
      animation: pulse 1s ease-in-out infinite;
    }

    .conn-status[data-state="connected"] { color: #6ee7b7; border-color: rgba(16, 185, 129, 0.4); }
    .conn-status[data-state="connected"] .status-dot {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .conn-status[data-state="disconnected"] { color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
    .conn-status[data-state="disconnected"] .status-dot {
      background-color: var(--danger);
      box-shadow: none;
    }

    .player-item.is-me { border-color: rgba(16, 185, 129, 0.5); }

    @keyframes pulse { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
      .conn-status[data-state="connecting"] .status-dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Lobby en Tiempo Real</h1>
      <p>Conectado al Coordinador de Sesiones por WebSocket autenticado</p>
    </header>

    <div class="card">
      <div class="top-bar">
        <div class="user-badge">
          <span>Jugador actual: <strong id="current-username">...</strong></span>
          <span id="conn-status" class="conn-status" data-state="connecting" role="status" aria-live="polite">
            <span class="status-dot"></span>
            <span id="conn-status-text">Conectando...</span>
          </span>
        </div>
        <div style="display:flex;gap:0.6rem;flex-wrap:wrap">
          <a href="game.html" class="btn" style="width:auto;text-decoration:none">🎲 Ir al tablero</a>
          <button id="logout-btn" type="button" class="btn btn-danger">Cerrar sesión</button>
        </div>
      </div>

      <h2>
        <span>Jugadores en línea</span>
        <span class="badge" id="players-count">0 conectados</span>
      </h2>

      <ul id="players-list" class="players-list">
        <li class="player-item">
          <span class="text-muted">Conectando con el coordinador...</span>
        </li>
      </ul>
    </div>
  </div>

  <script>
    // ── Token original leído al cargar la página ──────────────────────────────
    // Cualquier diferencia detectada en localStorage se trata como manipulación.
    const originalToken    = localStorage.getItem('token');
    const currentUsername  = localStorage.getItem('username') || 'Jugador';

    const defaultConfig = window.APP_CONFIG || {
      AUTH_URL: 'http://localhost:4000',
      COORDINATOR_WS: 'ws://localhost:5000'
    };

    const COORDINATOR_WS = (
      defaultConfig.COORDINATOR_WS
    ).replace(/\/+$/, '');

    // ── Utilidades ────────────────────────────────────────────────────────────
    let redirecting = false;

    function goToLogin(message, keepSession = false) {
      if (redirecting) return;
      redirecting = true;
      if (!keepSession) {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
      }
      if (message) sessionStorage.setItem('session_message', message);
      window.location.replace('login.html');
    }

    function setConnState(state, text) {
      const el = document.getElementById('conn-status');
      el.dataset.state = state;
      document.getElementById('conn-status-text').textContent = text;
    }

    function renderPlayers(players) {
      const listEl  = document.getElementById('players-list');
      const countEl = document.getElementById('players-count');
      countEl.textContent = `${players.length} ${players.length === 1 ? 'conectado' : 'conectados'}`;
      listEl.innerHTML = '';

      if (players.length === 0) {
        const emptyLi = document.createElement('li');
        emptyLi.className = 'player-item';
        emptyLi.textContent = 'No hay jugadores conectados';
        listEl.appendChild(emptyLi);
        return;
      }

      for (const p of players) {
        const li      = document.createElement('li');
        li.className  = 'player-item';

        const infoDiv = document.createElement('div');
        infoDiv.className = 'player-info';

        const dot = document.createElement('span');
        dot.className = 'status-dot';

        const nameSpan = document.createElement('strong');
        nameSpan.textContent = p.username;

        infoDiv.appendChild(dot);
        infoDiv.appendChild(nameSpan);

        if (p.username && currentUsername &&
            p.username.toLowerCase() === currentUsername.toLowerCase()) {
          li.classList.add('is-me');
          const youBadge = document.createElement('span');
          youBadge.className = 'badge';
          youBadge.textContent = 'Tú';
          infoDiv.appendChild(youBadge);
        }

        const idSpan = document.createElement('span');
        idSpan.style.color    = 'var(--text-muted)';
        idSpan.style.fontSize = '0.82rem';
        idSpan.textContent    = p.userId !== undefined ? `ID: ${p.userId}` : '';

        li.appendChild(infoDiv);
        li.appendChild(idSpan);
        listEl.appendChild(li);
      }
    }

    // ── Inicio ────────────────────────────────────────────────────────────────
    document.getElementById('current-username').textContent = currentUsername;

    if (!originalToken) {
      goToLogin('Debes iniciar sesión para acceder al lobby.');
    } else {
      startLobby();
    }

    function startLobby() {
      let intentionalClose   = false;
      let receivedPlayersList = false;

      setConnState('connecting', 'Conectando...');
      const ws = new WebSocket(`${COORDINATOR_WS}/connect?token=${encodeURIComponent(originalToken)}`);

      // ── CAPA 1: Polling de localStorage (detección client-side inmediata) ──
      // Compara cada 2 s el token guardado contra el originalToken.
      // Si el usuario lo cambió con DevTools, se detecta antes del próximo challenge.
      const tokenPollInterval = setInterval(() => {
        const currentToken = localStorage.getItem('token');
        if (currentToken !== originalToken) {
          clearInterval(tokenPollInterval);
          console.warn('[SECURITY] Token modificado en localStorage. Cerrando sesión.');
          intentionalClose = true; // evita el mensaje genérico de onclose
          if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
            ws.close(1000, 'token tampered client-side');
          }
          goToLogin('Sesión cerrada: se detectó una modificación no autorizada del token de sesión.');
        }
      }, 2000);

      // ── CAPA 1b: Evento storage (detección entre pestañas) ────────────────
      // Cuando otra pestaña cambia localStorage, este evento se dispara en la actual.
      window.addEventListener('storage', (e) => {
        if (e.key === 'token' && e.newValue !== originalToken) {
          clearInterval(tokenPollInterval);
          console.warn('[SECURITY] Token cambiado en otra pestaña. Cerrando sesión.');
          intentionalClose = true;
          if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
            ws.close(1000, 'token tampered from another tab');
          }
          goToLogin('Sesión cerrada: se detectó una modificación no autorizada del token de sesión.');
        }
      });

      ws.onopen = () => {
        console.log('[WS] Conectado al coordinador.');
        setConnState('connected', 'Conectado');
        if (!receivedPlayersList) {
          renderPlayers([{ username: currentUsername }]);
        }
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'players_update' && Array.isArray(msg.players)) {
            receivedPlayersList = true;
            renderPlayers(msg.players);
            return;
          }

          // ── CAPA 2: Respuesta al auth_challenge del servidor ──────────────
          // El coordinador pregunta periódicamente "¿cuál es tu token actual?".
          // Se responde con el token de localStorage. Si fue manipulado, el
          // coordinador lo verifica y cierra la conexión con código 4003.
          if (msg.type === 'auth_challenge') {
            const currentToken = localStorage.getItem('token');
            console.log('[WS] auth_challenge recibido — enviando auth_response.');
            ws.send(JSON.stringify({
              type: 'auth_response',
              data: { token: currentToken }
            }));
          }

        } catch (err) {
          console.error('[WS] Error parseando mensaje:', err);
        }
      };

      ws.onerror = (err) => {
        console.error('[WS] Error de conexión:', err);
      };

      ws.onclose = (event) => {
        clearInterval(tokenPollInterval);
        console.log('[WS] Cerrado:', event.code, event.reason);
        setConnState('disconnected', 'Desconectado');

        if (intentionalClose) {
          goToLogin('Has cerrado sesión correctamente.');
          return;
        }

        let reasonMsg   = 'La conexión con el coordinador se cerró inesperadamente.';
        let keepSession = false;

        if (event.code === 4001 || event.reason === 'invalid token') {
          reasonMsg = 'Sesión terminada: Token inválido o expirado. Por favor vuelve a iniciar sesión.';
        } else if (event.code === 4002) {
          reasonMsg   = 'Tu sesión fue desconectada porque abriste el juego en otra pestaña.';
          keepSession = true;
        } else if (event.code === 4003) {
          // El servidor detectó token manipulado en el auth_challenge
          reasonMsg = 'Sesión cerrada: se detectó una modificación no autorizada del token de sesión.';
        }

        goToLogin(reasonMsg, keepSession);
      };

      // ── Botón Cerrar sesión ───────────────────────────────────────────────
      document.getElementById('logout-btn').addEventListener('click', () => {
        clearInterval(tokenPollInterval);
        intentionalClose = true;
        setConnState('disconnected', 'Desconectando...');
        document.getElementById('logout-btn').disabled = true;

        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
          ws.close(1000, 'user logout');
          setTimeout(() => goToLogin('Has cerrado sesión correctamente.'), 1500);
        } else {
          goToLogin('Has cerrado sesión correctamente.');
        }
      });
    }
  </script>
</body>
</html>
